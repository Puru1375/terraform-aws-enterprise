name: Terraform CI/CD

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

jobs:

  # =========================================================
  # DEV TERRAFORM CHECK
  # =========================================================

  terraform-dev:
    name: Terraform Dev Checks
    runs-on: ubuntu-latest

    if: |
      github.ref == 'refs/heads/develop' ||
      github.base_ref == 'develop'

    defaults:
      run:
        working-directory: environments/dev

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984285320293:role/enterprise-dev-github-actions-role
          aws-region: ap-south-1

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: terraform plan -no-color -var-file=terraform-ci.tfvars


  # =========================================================
  # DEV APPLY
  # =========================================================

  terraform-apply-dev:
    name: Terraform Apply Dev

    needs: terraform-dev

    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: environments/dev

    env:
      AWS_REGION: ap-south-1
      TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984285320293:role/enterprise-dev-github-actions-role
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var-file=terraform-ci.tfvars


  # =========================================================
  # PRODUCTION TERRAFORM CHECK
  # =========================================================

  terraform-prod:
    name: Terraform Production Checks
    runs-on: ubuntu-latest

    if: |
      github.ref == 'refs/heads/main' ||
      github.base_ref == 'main'

    defaults:
      run:
        working-directory: environments/prod

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984285320293:role/enterprise-prod-github-plan-role
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}
        run: |
          terraform plan \
            -var-file=terraform-ci.tfvars \
            -out=production.tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: production-terraform-plan
          path: environments/prod/production.tfplan


  # =========================================================
  # PRODUCTION APPLY
  # =========================================================

  terraform-apply-prod:
    name: Terraform Apply Production

    needs: terraform-prod

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: environments/prod

    env:
      AWS_REGION: ap-south-1
      TF_VAR_db_password: ${{ secrets.TF_DB_PASSWORD }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::984285320293:role/enterprise-prod-github-actions-role
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: production-terraform-plan
          path: environments/prod

      - name: Terraform Apply
        run: terraform apply -auto-approve production.tfplan